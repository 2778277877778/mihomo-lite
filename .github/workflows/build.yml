name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build onedir package
        run: python scripts/build_windows.py

      - name: Create portable archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path packaging/output | Out-Null
          Compress-Archive -Path dist/MihomoLite/* -DestinationPath "packaging/output/MihomoLite-$env:TAG-portable-x64.zip" -CompressionLevel Optimal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: Checksums
        run: |
          Get-ChildItem packaging\output\* -Include *.exe,*.zip -File | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name
          } | Set-Content packaging\output\SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mihomo-lite-windows-x64
          path: |
            packaging/output/*.exe
            packaging/output/*.zip
            packaging/output/SHA256SUMS.txt
            dist/MihomoLite/**

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: "Mihomo Lite ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: |
            packaging/output/*.exe
            packaging/output/*.zip
            packaging/output/SHA256SUMS.txt
