name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build onedir package
        run: python scripts/build_windows.py

      - name: Create portable archive
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path dist/MihomoLite/* -DestinationPath "packaging/output/MihomoLite-$tag-portable-x64.zip" -CompressionLevel Optimal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: Checksums
        run: |
          Get-ChildItem packaging\output\* -Include *.exe,*.zip -File | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name
          } | Set-Content packaging\output\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-lite-windows-x64
          path: |
            packaging/output/*.exe
            packaging/output/*.zip
            packaging/output/SHA256SUMS.txt
            dist/MihomoLite/**

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packaging/output/*.exe
            packaging/output/*.zip
            packaging/output/SHA256SUMS.txt
