# A minimal, valid Mihomo profile for local testing.
# It routes everything through DIRECT and never contacts a real server.
mixed-port: 7890
mode: rule
log-level: info

proxies:
  - name: "Example SOCKS5"
    type: socks5
    server: 127.0.0.1
    port: 1080
  - name: "Example HTTP"
    type: http
    server: 127.0.0.1
    port: 8080

proxy-groups:
  - name: "Proxy"
    type: select
    proxies: ["Example SOCKS5", "Example HTTP", "DIRECT"]
  - name: "Auto"
    type: url-test
    proxies: ["Example SOCKS5", "Example HTTP"]
    url: "http://www.gstatic.com/generate_204"
    interval: 300

rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - GEOIP,LAN,DIRECT,no-resolve
  - MATCH,Proxy
